<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A101C" />
  <meta name="description" content="fin.app — suas finanças em um lugar só" />
  <title>fin.app</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="boot" class="boot"><span class="boot-logo">fin.app</span><span class="muted small" id="boot-msg">Carregando…</span></div>

  <div id="auth" hidden><div id="auth-box"></div></div>
  <div id="app" hidden></div>

  <div id="banner" class="banner" role="status" hidden>Conectando ao servidor… na primeira vez do dia pode levar até 1 minuto.</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para usar o fin.app.</p></noscript>

  <script>
    // Remove o cache offline de versões antigas do app e recarrega uma vez com a versão nova
    (function () {
      var tarefas = [];
      if ('serviceWorker' in navigator) {
        tarefas.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () { return regs.length > 0; });
        }));
      }
      if ('caches' in window) {
        tarefas.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () { return keys.length > 0; });
        }));
      }
      Promise.all(tarefas).then(function (res) {
        var controlada = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;
        if ((res.some(Boolean) || controlada) && !sessionStorage.getItem('fin.limpo')) {
          sessionStorage.setItem('fin.limpo', '1');
          location.reload();
        }
      }).catch(function () {});

      // Links antigos de redefinição de senha usavam ?token=
      var token = new URLSearchParams(location.search).get('token');
      if (token) history.replaceState(null, '', location.pathname + '#/redefinir?token=' + encodeURIComponent(token));

      setTimeout(function () {
        if (window.__finOk) return;
        var msg = document.getElementById('boot-msg');
        if (msg) msg.innerHTML = 'Não foi possível abrir o app.<br><button class="btn btn-primary" style="margin-top:12px" onclick="location.reload()">Recarregar</button>';
      }, 12000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="/js/config.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
